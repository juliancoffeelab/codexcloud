<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hex Command</title>
    <meta
      name="description"
      content="A small turn-based tactics game. Capture villages, recruit an army, and defeat the enemy commander."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2L29 9v14l-13 7L3 23V9z' fill='%236fdec0'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='serif' font-size='21' fill='%23121c25'%3EH%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <section id="startup" role="status" aria-live="polite">
      <h1>Hex Command</h1>
      <p id="startup-message">Loading the game…</p>
      <p><a id="startup-reload" href="./?reload=1">Reload game</a></p>
      <details id="startup-error" hidden>
        <summary>Error details</summary>
        <pre id="startup-detail"></pre>
      </details>
      <noscript>This game needs JavaScript enabled.</noscript>
    </section>
    <div id="app"></div>
    <script src="./startup.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/_build/default/frontend/output/frontend/Main.js"></script>
  </body>
</html>
