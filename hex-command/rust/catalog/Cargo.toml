[package]
name = "hex-command-catalog"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
runtime-catalog = ["dep:serde_json", "dep:sha2"]
wasm = ["dep:tsify", "dep:wasm-bindgen"]
bake = ["dep:databake"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
databake = { version = "0.1.8", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"], optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
serde_json = "1"
