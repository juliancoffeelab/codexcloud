[package]
name="hex-command-catalog"
version="0.1.0"
edition="2024"
publish=false
[features]
runtime-catalog=[]
default=[]
simulation=[]
wasm=["dep:ocamljsify", "dep:ocamljs_bindgen"]
bake=[]
[dependencies]
rustc-hash="2"
serde={version="1",features=["derive","rc"]}
serde_json="1"
sha2="0.10"

ocamljsify={path="../../../ocaml-js-bindgen/crates/ocamljsify",optional=true}
ocamljs_bindgen={path="../../../ocaml-js-bindgen/crates/ocamljs_bindgen",optional=true}
