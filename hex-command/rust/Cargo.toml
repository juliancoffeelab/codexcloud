[package]
name = "hex-command-simulation"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["catalog"]
resolver = "2"

[lib]
name = "hex_command_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hex-command-sim"
path = "src/main.rs"

[features]
default = []
wasm = ["dep:tsify", "dep:wasm-bindgen", "hex-command-catalog/wasm"]

[dependencies]
hex-command-catalog = { path = "catalog" }
rustc-hash = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arrow-array = "57"
arrow-buffer = "57"
arrow-schema = "57"
arrow-ipc = "57"
flate2 = "1"
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
hex-command-catalog = { path = "catalog", features = ["bake"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 8
panic = "abort"

# Web downloads benefit from less inlining and whole-program size optimization.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# Routine native simulations retain optimization without costly whole-program linking.
[profile.simulation]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
