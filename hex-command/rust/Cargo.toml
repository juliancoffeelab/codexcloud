[package]
name = "hex-command-simulation"
version = "0.1.0"
edition = "2024"

[workspace]
members=["catalog","freeze-derive","battle","training-python"]
resolver="2"

[lib]
name = "hex_command_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hex-command-sim"
path = "src/main.rs"
required-features = ["simulation"]

[features]
# Include native learned inference and observation code in ordinary builds.
default = ["training"]
training = ["dep:gemm", "dep:pulp"]
simulation = [
    "hex-command-catalog/simulation", "hex-command-battle/simulation",
    "dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema", "dep:arrow-ipc",
    "dep:flate2", "dep:mimalloc", "dep:clap",
]
runtime-catalog = ["hex-command-catalog/runtime-catalog", "hex-command-battle/runtime-catalog"]
wasm = ["dep:ocamljsify", "dep:ocamljs_bindgen", "hex-command-catalog/wasm", "hex-command-battle/wasm"]

[dependencies]
ocamljsify={path="../../ocaml-js-bindgen/crates/ocamljsify",optional=true}
ocamljs_bindgen={path="../../ocaml-js-bindgen/crates/ocamljs_bindgen",optional=true}
hex-command-battle={path="battle"}
hex-command-catalog={path="catalog"}
rustc-hash = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gemm = { version = "0.19", default-features = false, features = ["std"], optional = true }
pulp = { version = "0.22", default-features = false, features = ["std", "x86-v3", "x86-v4"], optional = true }
arrow-array = { version = "57", optional = true }
arrow-buffer = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }
arrow-ipc = { version = "57", optional = true }
flate2 = { version = "1", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 8
panic = "abort"

# Routine native simulations retain optimization without costly whole-program linking.
[profile.simulation]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Optimize browser download size independently of the native simulation profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# Explicit size-optimized builds can set CARGO_PROFILE_WASM_RELEASE_LTO=fat
# and CARGO_PROFILE_WASM_RELEASE_CODEGEN_UNITS=1.
lto = false
codegen-units = 16

# Routine browser checks prioritize incremental compilation over download size.
[profile.wasm-dev]
inherits = "dev"
opt-level = 0
debug = 0
lto = false
codegen-units = 16
incremental = true
panic = "abort"

# Dependencies change rarely; keep their runtime cost low without optimizing edits.
[profile.wasm-dev.package."*"]
opt-level = 1

[[test]]
name = "authored_arena"
required-features = ["simulation"]
