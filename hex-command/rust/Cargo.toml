[package]
name = "hex-command-simulation"
version = "0.1.0"
edition = "2024"

[lib]
name = "hex_command_core"

[[bin]]
name = "hex-command-sim"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 8
panic = "abort"
