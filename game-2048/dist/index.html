<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048</title><meta name="description" content="Slide, combine, and reach 2048. Play with arrow keys or swipe."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffe16a'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='22' fill='%23171924'%3E2%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f4f5fb;background:#10131e}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:clamp(3rem,13vw,4.7rem);letter-spacing:-.07em;line-height:1;margin:0}.score{background:#252b40;border-radius:12px;padding:10px 24px;text-align:center;min-width:100px}.score span{display:block;color:#aeb8d3;font-size:.875rem}.score strong{font-size:1.5rem}#message{font-size:1rem;min-height:3em;line-height:1.5;color:#bac4dd;margin:20px 0}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:#252b40;padding:10px;border-radius:20px;touch-action:none;user-select:none}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;background:#191f31;font-size:clamp(1.3rem,6vw,2.4rem);font-weight:750;color:#182036;transition:background .15s}.tile[data-value="2"]{background:#c9d9fb}.tile[data-value="4"]{background:#a9beff}.tile[data-value="8"]{background:#9a98ff}.tile[data-value="16"]{background:#b68bff}.tile[data-value="32"]{background:#ef9dd6}.tile[data-value="64"]{background:#ff9c9c}.tile[data-value="128"]{background:#ffb77e}.tile[data-value="256"]{background:#ffd074}.tile[data-value="512"]{background:#ffe16a}.tile[data-value="1024"]{background:#d5ed71;font-size:clamp(1.1rem,5vw,1.8rem)}.tile[data-value="2048"]{background:#91f2bd;font-size:clamp(1.1rem,5vw,1.8rem)}.tile.large{background:#7de5e2;font-size:clamp(1rem,4.5vw,1.6rem)}.tile.new{animation:appear .18s ease-out}@keyframes appear{from{transform:scale(.65)}to{transform:scale(1)}}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px}button{font:650 1rem system-ui;border:0;border-radius:12px;background:#ffe16a;color:#171924;padding:13px 20px;cursor:pointer}button:hover{background:#fff09c}button:focus-visible,.board:focus-visible{outline:3px solid #fff;outline-offset:4px}.hint{color:#aeb8d3;font-size:.875rem;line-height:1.5}footer{margin-top:24px;color:#8b98b7;font-size:.875rem;line-height:1.6}@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile.new{animation:none}}@media(max-width:360px){body{padding:16px}.board{gap:7px;padding:7px}.score{padding:10px 16px}}
</style></head><body><main><header><h1>2048<span style="color:#ffe16a">.</span></h1><div class="score"><span>Score</span><strong id="score">0</strong></div></header><p id="message" role="status" aria-live="polite">Slide the tiles. Match the numbers.<br>Can you reach 2048?</p><div class="board" tabindex="0" role="group" aria-label="2048 game board. Use arrow keys or swipe."></div><div class="controls"><span class="hint">Arrow keys on desktop.<br>Swipe on your phone.</span><button id="restart" type="button">New game</button></div><footer>Matching tiles combine into one. Each move adds a new tile, so leave yourself room to move.</footer></main>
<script>
const boardElement=document.querySelector('.board'),scoreElement=document.querySelector('#score'),messageElement=document.querySelector('#message');let board=Array(16).fill(0),score=0,won=false,newTile=-1,pointer=null;
const cells=Array.from({length:16},()=>{const cell=document.createElement('div');cell.className='tile';boardElement.append(cell);return cell});
function combine(line){const values=line.filter(Boolean),result=[];let points=0;for(let i=0;i<values.length;i++){if(values[i]===values[i+1]){const value=values[i]*2;result.push(value);points+=value;i++}else result.push(values[i])}while(result.length<4)result.push(0);return {values:result,points}}
function slide(source,direction){if(!['left','right','up','down'].includes(direction))throw new Error('Use left, right, up, or down.');const next=[...source];let points=0;for(let line=0;line<4;line++){const indices=Array.from({length:4},(_,i)=>direction==='left'?line*4+i:direction==='right'?line*4+3-i:direction==='up'?i*4+line:(3-i)*4+line);const merged=combine(indices.map(i=>source[i]));indices.forEach((i,k)=>next[i]=merged.values[k]);points+=merged.points}return {board:next,points,changed:next.some((value,i)=>value!==source[i])}}
function canMove(source){return source.includes(0)||source.some((value,i)=>(i%4<3&&value===source[i+1])||(i<12&&value===source[i+4]))}
function spawn(){const empty=board.map((value,i)=>value?null:i).filter(i=>i!==null);if(!empty.length)return;newTile=empty[Math.floor(Math.random()*empty.length)];board[newTile]=Math.random()<.9?2:4}
function state(){return {board:[...board],score,won,gameOver:!canMove(board)}}
function render(){cells.forEach((cell,i)=>{cell.textContent=board[i]||'';cell.dataset.value=board[i];cell.className='tile'+(board[i]>2048?' large':'')+(i===newTile?' new':'');cell.setAttribute('aria-label',`Row ${Math.floor(i/4)+1}, column ${i%4+1}: ${board[i]||'empty'}`)});scoreElement.textContent=score;messageElement.textContent=!canMove(board)?'No moves left. Start a new game and try again.':won?'You reached 2048! Keep going for a bigger tile.':'Slide the tiles. Match the numbers. Reach 2048.'}
function move(direction){const result=slide(board,direction);if(result.changed){board=result.board;score+=result.points;won=won||board.some(value=>value>=2048);spawn();render()}return {...state(),moved:result.changed}}
function reset(){board=Array(16).fill(0);score=0;won=false;spawn();spawn();render();return state()}
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey)return;const direction={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[event.key];if(direction){event.preventDefault();move(direction)}});
boardElement.addEventListener('pointerdown',event=>{if(!event.isPrimary||event.button!==0)return;pointer={id:event.pointerId,x:event.clientX,y:event.clientY};boardElement.setPointerCapture(event.pointerId)});
boardElement.addEventListener('pointerup',event=>{if(!pointer||pointer.id!==event.pointerId)return;const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;pointer=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});boardElement.addEventListener('pointercancel',()=>pointer=null);document.querySelector('#restart').addEventListener('click',reset);reset();
if(document.modelContext?.registerTool){const tools=[{name:'get_game_state',description:'Read the 2048 board, score, win, and game-over state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:state},{name:'move_tiles',description:'Slide the 2048 board in one direction, merge matching tiles, and spawn a tile if the board changes.',inputSchema:{type:'object',properties:{direction:{type:'string',enum:['left','right','up','down']}},required:['direction'],additionalProperties:false},execute:input=>move(input.direction)},{name:'start_new_game',description:'Reset the score and begin a fresh 2048 game.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:reset}];for(const tool of tools)try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch{}}
</script></body></html>
