[package]
name = "rust-to-ocaml-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ocamljs_bindgen = { path = "../../../crates/ocamljs_bindgen" }
ocamljsify = { path = "../../../crates/ocamljsify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
lto = "thin"
panic = "abort"
