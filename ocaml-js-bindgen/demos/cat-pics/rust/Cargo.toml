[package]
name = "cat-pics-demo"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
conformance = []

[dependencies]
ocamljs_bindgen = { path = "../../../crates/ocamljs_bindgen" }
ocamljsify = { path = "../../../crates/ocamljsify" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[workspace]

[profile.release]
lto = "thin"
panic = "abort"
