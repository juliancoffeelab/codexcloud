<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main aria-label="Calculator">
      <h1>Calculator</h1>
      <output id="result" aria-live="polite" aria-label="Result">0</output>
      <div class="keypad">
        <button id="key-Escape">AC</button
        ><button id="key-Backspace" aria-label="Backspace">⌫</button
        ><button id="key-%">%</button><button id="key-/">÷</button>
        <button id="key-7">7</button><button id="key-8">8</button
        ><button id="key-9">9</button><button id="key-*">×</button>
        <button id="key-4">4</button><button id="key-5">5</button
        ><button id="key-6">6</button><button id="key--">−</button>
        <button id="key-1">1</button><button id="key-2">2</button
        ><button id="key-3">3</button><button id="key-+">+</button>
        <button id="key-n" aria-label="Change sign">±</button
        ><button id="key-0">0</button><button id="key-.">.</button
        ><button id="key-Enter">=</button>
      </div>
      <p>Use the keypad or your keyboard. Escape clears; Enter calculates.</p>
    </main>
    <script type="module" src="./frontend.mjs"></script>
  </body>
</html>
